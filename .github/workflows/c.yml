on:
  push:
    branches: develop
    paths:
      - 'C/**'
      - '.github/workflows/c.yml'
  pull_request:
    branches: develop
    paths:
      - 'C/**'
      - '.github/workflows/c.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: C
    steps:
    - uses: actions/checkout@v4

    # ponytail: CMakeLists requires cmake >= 4.1; ubuntu-latest ships 3.x.
    - name: Install CMake
      run: pip install 'cmake>=4.1'

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    # ponytail: ChaseHQ_Tests links no SDL3, so no SDL install needed here.
    # Add the full ChaseHQ target once SDL3 is packaged on the runner.
    - name: Build tests
      run: cmake --build build --target ChaseHQ_Tests

    - name: Run tests
      run: ./build/ChaseHQ_Tests

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: C
    steps:
    - uses: actions/checkout@v4

    - name: Install SDL3 (vcpkg)
      run: vcpkg install sdl3:x64-windows

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: cmake --build build --config Debug

    - name: Run tests
      run: build\Debug\ChaseHQ_Tests.exe

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: C
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build app
      run: cmake --build build --target ChaseHQApp

  riscos:
    runs-on: ubuntu-latest
    container: riscosdotinfo/riscos-gccsdk-4.7:latest
    defaults:
      run:
        working-directory: C
    steps:
    - uses: actions/checkout@v4

    - name: Cross compile Chase H.Q. for RISC OS
      run: |
        apt-get update
        apt-get install -y ca-certificates
        ./riscos-ci-build.sh

    - name: Archive it
      run: |
        apt-get install -y python3 python3-pip
        pip install rozipinfo
        cd build-riscos/install
        find . -type f -not -name '*,*' -exec mv '{}' '{},fff' \;  # ensure that type-less files come out as Text
        python3 -m rozipfile --verbose --create ../../ChaseHQ-RISC_OS.zip *

    - uses: actions/upload-artifact@v4
      with:
        name: Chase-HQ-RISC_OS
        path: C/ChaseHQ-RISC_OS.zip
        if-no-files-found: error
