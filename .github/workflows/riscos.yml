---
name: RISC OS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["**"]
    paths:
      - 'C/**'
      - '.github/workflows/riscos.yml'

permissions:
  contents: read

env:
  COMPONENT_NAME: ChaseHQ

jobs:
  # ponytail: tag pushes must always build (they drive `release` below), so the
  # paths filter can't live on the `push` trigger itself - it would also gate
  # tags. Compute it as a job output instead, skip it entirely for tags, and
  # gate build-riscos on either "is a tag" or "this job says C/ changed".
  changes:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      c: ${{ steps.filter.outputs.c }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            c:
              - 'C/**'
              - '.github/workflows/riscos.yml'

  build-riscos:
    needs: changes
    if: |
      always() &&
      (github.ref_type == 'tag' || github.event_name == 'pull_request' || needs.changes.outputs.c == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: riscos-build-server
    outputs:
      version: ${{ steps.version.outputs.version }}
      leafname: ${{ steps.version.outputs.leafname }}

    steps:
      - uses: actions/checkout@v7

      - name: Obtain prerequisite build tool
        run: |
          curl -s -L -o riscos-build-online https://github.com/gerph/robuild-client/releases/download/v0.07/riscos-build-online
          chmod +x riscos-build-online

      - name: Prepare the RISC OS source layout
        run: sh C/apps/riscos/make-riscos-layout

      - name: Build through build.riscos.online
        run: |
          zip -q9r /tmp/source-archive.zip \
            .rotransform/riscos C
          (cd C/apps/riscos && zip -q9 /tmp/source-archive.zip .robuild.yaml)
          ./riscos-build-online -i /tmp/source-archive.zip -a off -t 180 -o /tmp/built

      - name: Give the output a versioned name
        id: version
        run: |
          if [ -f C/apps/riscos/VersionNum ]; then
              version=$(sed '/Module_FullVersion / ! d ; s/.*Module_FullVersion *"\(.*\)"/\1/' C/apps/riscos/VersionNum)
          else
              version=$(git rev-parse --short HEAD)
          fi
          leafname="$COMPONENT_NAME-$version.zip"
          if [ -f /tmp/built,a91 ]; then
              cp /tmp/built,a91 "$leafname"
          else
              echo "No archive was built?"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "leafname=$leafname" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: RISCOS-build
          path: ${{ steps.version.outputs.leafname }}
          if-no-files-found: error

  release:
    needs: build-riscos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built RISC OS application
        uses: actions/download-artifact@v8
        with:
          name: RISCOS-build

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          prerelease: false
          draft: true
          artifacts: ${{ needs.build-riscos.outputs.leafname }}
          artifactContentType: application/zip
